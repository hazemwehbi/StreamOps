name: Qualité
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: streamops_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-ephemeral-only@localhost:5432/streamops_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l cmd internal migrations tests)"
      - run: go vet ./...
      - run: go test -race -coverpkg=./internal/...,./migrations -coverprofile=coverage.out ./...
      - run: go build ./cmd/api
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: docker compose --env-file .env.example config --no-interpolate --quiet
      - run: docker build -t streamops:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/bootstrap.sh
      - run: docker compose up --build -d
      - run: timeout 180 sh -c 'until curl --silent --fail http://localhost:8080/readyz; do sleep 2; done'
      - run: curl --fail http://localhost:8080/readyz
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
